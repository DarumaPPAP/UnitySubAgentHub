name: SubAgent Hub Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - README.md
      - docs/architecture/**
      - docs/references/**
      - docs/decisions/**
      - ci/**
      - ci/evidence/**
      - Hub/Tools/**
      - repository-layout.json
      - Hub/repository-authority.yaml
      - Hub/specialist-execution-admission.yaml
      - Hub/Registry/**
      - Hub/Schemas/**
      - Hub/SubAgents/**
      - Packages/com.darumappap.artist-subagent/**
      - cli/artist/**
      - ci/compatibility/support-matrix.yaml
      - Hub/Tests/**
      - docs/development/branch-policy.md
      - .github/branch-policy.json
      - .github/workflows/branch-policy.yml
      - .github/workflows/subagent-hub-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hub:
    name: Validate registry, manifests, and snapshot contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install YAML validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema
      - name: Validate branch policy contract
        run: python Hub/Tools/validate_branch_policy.py
      - name: Validate final repository layout ownership
        run: python Hub/Tools/validate_layout.py
      - name: Validate repository authority and mirrored declarations
        run: python Hub/Tools/validate_repository.py
      - name: Validate every registered SubAgent manifest
        run: python Hub/Tools/validate_registry.py
      - name: Test Hub validation failures and multi-agent registration
        run: python -m unittest discover -s Hub/Tests -p 'test_*.py' -v
      - name: Validate Unity CI fixture ownership (static only)
        run: python ci/verify/validate_unity_fixtures.py
      - name: Test Unity resolver and honest evidence state machine
        run: python -m unittest discover -s ci/verify -p 'test_unity_ci*.py' -v
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Build Artist CLI for the required all-PR contract
        run: dotnet build cli/artist/UnityArtist.Cli.csproj --configuration Release
      - name: Test Artist host contracts for the required all-PR contract
        run: python -m unittest discover -s cli/artist/tests -p 'test_*.py' -v
      - name: Export and validate consumer-neutral Hub snapshot
        run: python Hub/Tools/export_snapshot.py --output "$RUNNER_TEMP/subagent-catalog.yaml"

      - name: Checkout UnityAgent consumer
        uses: actions/checkout@v7
        with:
          repository: DarumaPPAP/UnityAgent
          ref: main
          path: .tmp-unityagent-consumer
          persist-credentials: false

      - name: Install the checked-out UnityAgent consumer package
        run: python -m pip install --disable-pip-version-check -e .tmp-unityagent-consumer "setuptools>=68" wheel

      - name: Validate this Hub commit with the existing Consumer Import Gate
        shell: bash
        run: |
          set -euo pipefail
          hub_commit="$(git rev-parse HEAD)"
          git -C .tmp-unityagent-consumer rev-parse HEAD
          # Explicit dual-read transition for the Agent P5 tools rename.
          consumer_root=.tmp-unityagent-consumer
          importer_candidates=()
          for candidate in "$consumer_root/Tools/import_subagent_catalog.py" "$consumer_root/tools/import_subagent_catalog.py"; do
            if [[ -f "$candidate" ]]; then
              importer_candidates+=("$candidate")
            fi
          done
          if [[ ${#importer_candidates[@]} -ne 1 ]]; then
            echo "Expected exactly one known UnityAgent Consumer importer path; unknown or ambiguous checkout" >&2
            exit 1
          fi
          consumer_importer="${importer_candidates[0]}"
          snapshot_hash="$(sha256sum "$RUNNER_TEMP/subagent-catalog.yaml" | cut -d ' ' -f 1)"
          python "$consumer_importer" \
            --snapshot "$RUNNER_TEMP/subagent-catalog.yaml" \
            --source-ref "github://DarumaPPAP/UnitySubAgentHub/development/$hub_commit/Hub/Tools/export_snapshot.py" \
            --expected-sha256 "$snapshot_hash" > "$RUNNER_TEMP/hub-consumer-import-plan.json"
          python - "$RUNNER_TEMP/hub-consumer-import-plan.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              plan = json.load(stream)
          if plan["status"] != "no_op" or plan["apply"]["catalog_write_performed"]:
              raise SystemExit("Hub change requires a reviewed UnityAgent consumer migration; import plan is not a read-only no-op")
          print("Hub Development snapshot is compatible with UnityAgent main (read-only no-op).")
          PY

      - name: Upload Consumer compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hub-consumer-import-plan
          path: ${{ runner.temp }}/hub-consumer-import-plan.json
          if-no-files-found: ignore
