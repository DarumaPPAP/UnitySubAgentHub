schema_version: "2.1"
kind: artist_subagent_capability_catalog
authority: current_production
product: ArtistSubAgent
subagent_id: artist_subagent
release_version: "0.0.1-beta"
installation:
  mode: optional
  auto_install: false
  unavailable_behavior: exclude_from_resolution
backend:
  id: unity_artist_cli
  package: com.darumappap.unity-artist
  executable: unity-artist
  transport: official_unity_cli_pipeline
  editor_bridge: com.unity.pipeline
  fallback_transport: official_unity_cli_bounded_batch_fallback
  fallback_policy: concrete_cli_pipeline_gate_failure_only

capabilities:
  visual_art:
    status: editor_operational
    workflows: [inspect, lookdev_refine, lighting, environment, camera, capture, evaluate, refine]
    owner: artist_subagent
  cinematic:
    status: editor_operational
    workflows: [timeline, shot, binding, marker, signal, activation, control, animation]
    owner: artist_subagent

backend_commands:
  - help
  - version
  - doctor
  - capabilities
  - install
  - inspect
  - plan
  - preview
  - apply
  - capture
  - evaluate
  - refine
  - cinematic
  - history

delegated_generic_operations:
  - project.inspect
  - project.test
  - project.build
  - compile.observe
  - editor.status
  - pipeline.install
  - command.discovery

forbidden_surface:
  - generic_gameobject_crud
  - generic_hierarchy_crud
  - arbitrary_eval
  - automatic_save
  - automatic_full_bake
  - silent_fallback
  - second_control_plane
  - second_provider_registry
  - standalone_codex_plugin
  - mcp_transport

legacy_reference:
  product: MyUnityMCP
  version: "1.1.1"
  path: Legacy/MyUnityMCP-1.1.1
  production_enabled: false
