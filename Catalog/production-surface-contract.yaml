schema_version: "2.1"
kind: production_surface_contract
authority: current_production
product: ArtistSubAgent
subagent_id: artist_subagent
backend_id: unity_artist_cli
release_version: "0.0.1-beta"
status: subagent_with_cli_editor_backend
installation_mode: optional
auto_install: false
unavailable_behavior: exclude_from_resolution
backend_package: com.darumappap.unity-artist
backend_executable: unity-artist
transport: official_unity_cli_pipeline
fallback_transport: official_unity_cli_bounded_batch_fallback
fallback_policy: concrete_cli_pipeline_gate_failure_only
backend_command_count: 14
backend_commands: [help, version, doctor, capabilities, install, inspect, plan, preview, apply, capture, evaluate, refine, cinematic, history]
artist_specific_capabilities: [visual_art, lookdev, lighting, environment, camera, cinematic, timeline, capture, evaluate, refine]
generic_operations: delegated_to_official_unity_cli
mutation_lifecycle: inspect_plan_exact_diff_expected_revision_approval_apply_evidence
automatic_save: false
arbitrary_eval: false
second_control_plane: false
second_provider_registry: false
standalone_codex_plugin: false
mcp_transport: false
release_matrix:
  - { unity_version: "2022.3 LTS", render_pipeline: builtin, support_tier: primary, supported: true, transport: official_unity_cli_pipeline }
  - { unity_version: "Unity 6.x+", render_pipeline: builtin, support_tier: primary, supported: true, transport: official_unity_cli_pipeline }
  - { unity_version: "Unity 6.x+", render_pipeline: urp, support_tier: primary, supported: true, transport: official_unity_cli_pipeline }
  - { unity_version: "Unity 6.x+", render_pipeline: hdrp, support_tier: primary, supported: true, transport: official_unity_cli_pipeline }
unsupported_before_mutation:
  - "2022.3 + URP"
  - "2022.3 + HDRP"
  - "Unity 2023"
  - "URP 14-16 formal release rows"
legacy_surface:
  path: Legacy/MyUnityMCP-1.1.1
  version: "1.1.1"
  production_enabled: false
